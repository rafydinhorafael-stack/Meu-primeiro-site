<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projetos | Amade Rafael</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 0;
    }

    h1 {
      text-align: center;
      font-size: 48px;
      margin-bottom: 40px;
    }

    .projeto {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .projeto h2 {
      margin-top: 0;
    }

    .projeto p {
      color: #d1d5db;
      line-height: 1.6;
    }

    .botao {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      background: white;
      color: #111827;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .voltar {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Meus Projetos 🚀</h1>

    <div class="projeto">
      <h2>🌐 Meu Primeiro Site</h2>
      <p>
        O meu primeiro projeto criado com HTML e CSS
        e publicado na internet.
      </p>
      <a class="botao" href="index.html">
        Ver projeto
      </a>
    </div>

    <div class="projeto">
      <h2>💡 Próximo projeto</h2>
      <p>
        Aqui vou colocar a minha próxima aplicação
        enquanto continuo a aprender programação.
      </p>
    </div>

    <a class="voltar" href="index.html">
      ← Voltar para a página inicial
    </a>

  </div>

</body>
</html>

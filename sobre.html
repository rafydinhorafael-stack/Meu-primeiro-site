<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobre mim | Amade Rafael</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 700px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #d1d5db;
    }

    .botao {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 24px;
      background: white;
      color: #111827;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>Sobre mim 👋🏾</h1>

    <p>Olá! Sou Amade Rafael.</p>

    <p>
      Estou a aprender programação e a criar
      os meus primeiros projetos web.
    </p>

    <p>
      Este é o segundo passo do meu percurso
      como criador.
    </p>

    <a class="botao" href="index.html">
      ← Voltar para a página inicial
    </a>

  </main>

</body>
</html>
